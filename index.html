        function pickPropArray(array, property){
            return array
            .filter((item) => Object.hasOwn(item,property))
            .map((item) => item[property]);
        }

        // Задание 3
        function spinWords(text){
            return text
                .split(' ')
                .map((word) => {
                    if (word.length >= 5) {
                        return word.split('').reverse().join('');
                    }
                    return word; 
                })
                .join(' ');
        }
        
        console.log('Задание 3') 
        const result1 = spinWords( "Привет от Legacy" )
        console.log(result1) 

        const result2 = spinWords( "This is a test" )
        console.log(result2)

        // Задание 4
        function targetSum(nums, target) {
            let numPlace = new Map();
        
            for (let i = 0; i < nums.length; i++) {
                let difference = target - nums[i];
        
                if (numPlace.has(difference)) {
                    return [numPlace.get(difference), i];
                }
        
                numPlace.set(nums[i], i);
            }
      
            return [];
        }
        console.log('Задание 4')
        console.log(targetSum([2, 7, 11, 15], 9));

        // Задание 5
        function commonPrefix(text) {
            if (text.length === 0){
                return "";
            } 
            let firstWord = text[0];
            let longestPart = "";
        
            for (let i = 0; i < firstWord.length; i++) {
                for (let j = i + 2; j <= firstWord.length; j++) {
                    let wordPart = firstWord.slice(i, j);
                    let isInWords = text.every((word) => word.includes(wordPart));
                    
                    if (isInWords && wordPart.length > longestPart.length) {
                        longestPart = wordPart;
                    }
                }
            }
            return longestPart;
        }

        console.log(commonPrefix(["цветок", "поток", "хлопок"]));
        console.log(commonPrefix(["собака", "гоночная машина", "машина"]));
